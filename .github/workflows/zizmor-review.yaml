name: Zizmor Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  zizmor:
    name: Zizmor Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read         # Required to check out the code
      actions: read          # Required for zizmor's online repository audits

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Zizmor Action
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
            annotations: true
            advanced-security: false  # Has funny behavior around lines not in diff
