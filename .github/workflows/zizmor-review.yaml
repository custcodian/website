name: Zizmor Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  zizmor:
    name: Zizmor Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read         # Required to check out the code
      actions: read          # Required for zizmor's online repository audits

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Zizmor Action
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
            annotations: true
            advanced-security: false  # Has funny behavior around lines not in diff
